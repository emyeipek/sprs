<!DOCTYPE html>
<html lang="tr">
<head>
  <link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunset Menü & Adisyon (Aramalı)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#0d0d0d;
    --yellow:#f7c600;
    --red:#e0201c;
    --cream:#fff7dc;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--black);
    font-family:'Poppins',sans-serif;
    color:var(--cream);
    -webkit-font-smoothing:antialiased;
    padding-bottom:60px;
  }
  /* HERO BÖLÜMÜ */
  .hero{
    background:var(--yellow);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:38px 20px 30px;
    position:relative;
    border-bottom:6px solid var(--black);
  }
  .hero .brand{
    font-family:'Great Vibes',cursive;
    color:var(--red);
    font-size:3.2rem;
    text-shadow:0 0 14px rgba(224,32,28,.55), 0 0 2px rgba(224,32,28,.8);
    line-height:1;
  }
  .sun{
    width:90px;height:auto;margin-bottom:6px;
  }
  .hero .menu-word{
    font-family:'Great Vibes',cursive;
    color:var(--red);
    font-size:3.6rem;
    text-shadow:0 0 14px rgba(224,32,28,.55), 0 0 2px rgba(224,32,28,.8);
    margin-top:-4px;
  }

  /* ANA KONTEYNER */
  .main-container {
    display: flex;
    flex-wrap: wrap;
    max-width: 1000px;
    margin: 0 auto;
    padding: 10px;
    gap: 20px;
  }

  /* ARAMA ÇUBUĞU */
  .search-container {
    width: 100%;
    margin-bottom: 10px;
  }
  .search-input {
    width: 100%;
    padding: 14px 18px;
    font-size: 16px;
    background: #141414;
    color: var(--cream);
    border: 1px solid #333;
    border-radius: 14px;
    font-family: 'Poppins', sans-serif;
    transition: border-color 0.3s;
  }
  .search-input:focus {
    outline: none;
    border-color: var(--yellow);
  }
  .search-input::placeholder {
    color: #666;
  }

  /* AKORDİYON MENÜ */
  .menu-section {
    flex: 2;
    min-width: 300px;
    padding: 10px 0;
  }
  .category{
    background:#141414;
    border:1px solid #262626;
    border-radius:14px;
    margin-bottom:12px;
    overflow:hidden;
  }
  .category .cat-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:16px 18px;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  .category h2{
    font-family:'Great Vibes',cursive;
    color:var(--yellow);
    font-size:1.9rem;
    line-height:1;
  }
  .cat-header .chevron{
    flex:0 0 auto;
    width:22px;height:22px;
    color:var(--red);
    transition:transform .35s cubic-bezier(.4,0,.2,1);
  }
  .category.open .chevron{
    transform:rotate(180deg);
  }
  .cat-body{
    display:grid;
    grid-template-rows:0fr;
    transition:grid-template-rows .38s cubic-bezier(.4,0,.2,1);
  }
  .category.open .cat-body{
    grid-template-rows:1fr;
  }
  .cat-body-inner{
    overflow:hidden;
  }
  .cat-items{
    padding:0 18px 16px;
    border-top:1px solid rgba(247,198,0,.2);
  }
  .item{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding:11px 0;
    border-bottom:1px dotted rgba(247,198,0,.25);
    gap:10px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .item:hover { background: rgba(247,198,0,.05); border-radius: 5px; }
  .item:last-child{ border-bottom:none; }
  .item .name{ font-size:.95rem; font-weight:500; }
  .item .note{ display:block; font-size:.72rem; color:#b8b8b8; font-weight:400; }
  .item .price{ font-weight:700; color:var(--yellow); white-space:nowrap; font-size:.95rem; }

  /* SEPET PANELI */
  .cart-panel {
    flex: 1;
    min-width: 300px;
    background: #141414;
    border: 2px solid var(--yellow);
    border-radius: 14px;
    padding: 20px;
    margin-top: 10px;
    display: flex;
    flex-direction: column;
    height: fit-content;
  }
  .cart-panel h2 {
    font-family: 'Great Vibes', cursive;
    color: var(--yellow);
    font-size: 2.2rem;
    text-align: center;
    margin-bottom: 15px;
  }
  .theme-input {
    width: 100%; padding: 15px; font-size: 18px; background: var(--black);
    color: var(--cream); border: 1px solid #333; border-radius: 8px;
    margin-bottom: 15px; text-align: center; font-family: 'Poppins', sans-serif;
  }
  .theme-input:focus { outline: none; border-color: var(--yellow); }
  .cart-items { flex: 1; max-height: 300px; overflow-y: auto; margin-bottom: 15px; }
  .cart-item {
    background: #0d0d0d; padding: 10px; margin-bottom: 10px; border-radius: 8px;
    position: relative; border: 1px solid #333;
  }
  .cart-item-title { font-weight: bold; font-size: 0.95rem; color: var(--cream); margin-bottom: 5px; }
  .cart-item-note { color: var(--red); font-size: 0.8rem; }
  .delete-btn {
    position: absolute; right: 10px; top: 10px; background: none; border: none;
    color: var(--red); cursor: pointer; font-weight: bold; font-size: 18px;
  }
  .submit-btn {
    width: 100%; padding: 15px; background: var(--yellow); color: var(--black);
    border: none; border-radius: 8px; font-size: 1.1rem; font-weight: 700;
    cursor: pointer; font-family: 'Poppins', sans-serif; transition: transform 0.2s;
  }
  .submit-btn:hover { transform: scale(1.02); background: #e6b800; }

  /* MODAL (Popup) */
  .modal-overlay { 
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
    background: rgba(0,0,0,0.8); z-index: 1000;
    display: none; justify-content: center; align-items: center; 
  }
  .modal-content { 
    background: #141414; padding: 25px; border-radius: 14px; 
    width: 90%; max-width: 350px; text-align: center; border: 1px solid var(--yellow);
  }
  .modal-content h2 { color: var(--yellow); margin-bottom: 15px; }
  .qty-controls { display: flex; justify-content: center; align-items: center; gap: 20px; margin: 20px 0; }
  .qty-btn { 
    font-size: 24px; width: 45px; height: 45px; border-radius: 50%; border: none; 
    background: #333; color: var(--yellow); cursor: pointer; font-weight: bold;
  }
  .qty-btn:active { background: #555; }
  #noteInput {
    width: 100%; padding: 12px; background: #0d0d0d; color: var(--cream);
    border: 1px solid #333; border-radius: 8px; margin-bottom: 20px; resize: none; font-family: 'Poppins', sans-serif;
  }
  #noteInput:focus { outline: none; border-color: var(--yellow); }
  .modal-actions { display: flex; gap: 10px; }
  .modal-actions button { flex: 1; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-family: 'Poppins', sans-serif; }
  .cancel-btn { background: #333; color: var(--cream); }
  .add-btn { background: var(--red); color: var(--cream); }

  @media (max-width:400px){
    .hero .menu-word{ font-size:2.9rem; }
    .hero .brand{ font-size:2.1rem; }
    .category h2{ font-size:1.6rem; }
  }
  .empty-msg{ text-align:center; color:#888; padding:60px 20px; font-size:.9rem; }
  footer{ text-align:center; padding:26px 10px 10px; color:#666; font-size:.72rem; }
</style>
</head>
<body>

<div class="hero">
  <svg class="sun" viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg">
    <g stroke="var(--red)" stroke-width="4" stroke-linecap="round">
      <line x1="100" y1="5" x2="100" y2="25"/>
      <line x1="60" y1="10" x2="68" y2="28"/>
      <line x1="140" y1="10" x2="132" y2="28"/>
      <line x1="30" y1="28" x2="42" y2="40"/>
      <line x1="170" y1="28" x2="158" y2="40"/>
      <line x1="15" y1="55" x2="30" y2="55"/>
      <line x1="185" y1="55" x2="170" y2="55"/>
      <line x1="80" y1="8" x2="84" y2="27"/>
      <line x1="120" y1="8" x2="116" y2="27"/>
      <line x1="45" y1="18" x2="55" y2="32"/>
      <line x1="155" y1="18" x2="145" y2="32"/>
    </g>
    <path d="M40 65 A60 60 0 0 1 160 65" fill="none" stroke="var(--red)" stroke-width="4"/>
    <path d="M20 90 Q50 78 80 90 T140 90 T180 90" fill="none" stroke="var(--red)" stroke-width="3"/>
    <path d="M15 105 Q50 93 85 105 T155 105 T185 105" fill="none" stroke="var(--red)" stroke-width="3"/>
  </svg>
  <div class="menu-word">Sunset</div>
  <div class="brand" style="font-size:2.6rem;margin-top:-8px;">Menü</div>
</div>

<div class="main-container">
  <!-- MENÜ LİSTESİ VE ARAMA -->
  <div class="menu-section">
    <div class="search-container">
      <input type="text" id="searchInput" class="search-input" placeholder="Ürün ara... (Örn: Kahve)">
    </div>
    <div class="accordion" id="content">
      <div class="empty-msg">Yükleniyor...</div>
    </div>
  </div>

  <!-- SEPET BÖLÜMÜ -->
  <div class="cart-panel">
    <h2>Sipariş</h2>
    <input type="number" id="tableNo" class="theme-input" placeholder="Masa No (Örn: 5)">
    <div class="cart-items" id="cartItems"></div>
    <button class="submit-btn" onclick="submitOrder()">MUTFAĞA GÖNDER</button>
  </div>
</div>

<!-- POPUP (Adet & Not Girişi) -->
<div class="modal-overlay" id="modal">
  <div class="modal-content">
      <h2 id="modalTitle">Ürün Adı</h2>
      <div class="qty-controls">
          <button class="qty-btn" onclick="changeQty(-1)">-</button>
          <span id="qtyDisplay" style="font-size: 28px; font-weight: bold; color: var(--cream);">1</span>
          <button class="qty-btn" onclick="changeQty(1)">+</button>
      </div>
      <textarea id="noteInput" rows="2" placeholder="Özel istek var mı? (Örn: Az Şekerli)"></textarea>
      <div class="modal-actions">
          <button class="cancel-btn" onclick="closeModal()">İptal</button>
          <button class="add-btn" onclick="addToCart()">Ekle</button>
      </div>
  </div>
</div>

<footer>Fiyatlara KDV dahildir · Sunset Cafe</footer>

<script>
// JSONBIN AYARLARI
const BIN_ID = "6a5791efda38895dfe613665"; 
const API_KEY = "$2a$10$koCErSpzoZ4Dn9HUre3RJ.oRrkiOClpNgct1ZtTCEemsldHQoXN82";

// GLOBAL DEĞİŞKENLER
let globalMenuData = [];
let cart = [];
let tempProductName = "";
let tempProductPrice = 0;
let tempQty = 1;

function formatPrice(p){
  const n = Number(p) || 0;
  return n.toFixed(2).replace(".00","") + " ₺";
}

// 1. MENÜYÜ ÇEKME
function loadMenu(){
  fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
    headers: { 'X-Master-Key': API_KEY }
  })
  .then(res => res.json())
  .then(json => {
    globalMenuData = json.record || [];
    if(globalMenuData.length > 0) {
      render(globalMenuData);
    } else {
      document.getElementById("content").innerHTML = '<div class="empty-msg">Menü henüz hazırlanıyor veya boş.</div>';
    }
  })
  .catch(err => {
    document.getElementById("content").innerHTML = '<div class="empty-msg">Bağlantı hatası. Menü yüklenemedi.</div>';
  });
}

// 2. MENÜYÜ EKRANA BASMA (Arama özelliği için güncellendi)
function render(data, isSearchActive = false){
  const contentEl = document.getElementById("content");
  contentEl.innerHTML = "";

  if(data.length === 0) {
      contentEl.innerHTML = '<div class="empty-msg">Aradığınız ürün bulunamadı.</div>';
      return;
  }

  data.forEach((cat, idx) => {
    const section = document.createElement("div");
    // Arama yapılıyorsa tüm kategorileri açık tut, normalde sadece ilkini aç
    const isOpen = isSearchActive ? " open" : (idx === 0 ? " open" : "");
    section.className = "category" + isOpen;
    section.id = "sec-"+cat.id;

    let itemsHtml = "";
    if (cat.items) {
      itemsHtml = cat.items.map(it => `
        <div class="item" onclick="openModal('${it.name.replace(/'/g, "\\'")}', ${it.price})">
          <span class="name">${it.name}${it.note ? `<span class="note">${it.note}</span>` : ""}</span>
          <span class="price">${formatPrice(it.price)}</span>
        </div>`).join("");
    }

    section.innerHTML = `
      <div class="cat-header">
        <h2>${cat.name}</h2>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </div>
      <div class="cat-body">
        <div class="cat-body-inner">
          <div class="cat-items">${itemsHtml}</div>
        </div>
      </div>`;

    section.querySelector(".cat-header").addEventListener("click", () => {
      section.classList.toggle("open");
    });

    contentEl.appendChild(section);
  });
}

// 3. ARAMA FONKSİYONU
document.getElementById('searchInput').addEventListener('input', function(e) {
    const query = e.target.value.trim().toLocaleLowerCase('tr-TR');
    
    if (!query) {
        render(globalMenuData, false); // Arama boşsa orjinal menüyü çiz
        return;
    }

    const filteredData = globalMenuData.map(cat => {
        if (!cat.items) return null;
        
        // Ürün adında veya notunda arama yap
        const matchedItems = cat.items.filter(item => 
            item.name.toLocaleLowerCase('tr-TR').includes(query) || 
            (item.note && item.note.toLocaleLowerCase('tr-TR').includes(query))
        );
        
        // Eğer bu kategoride eşleşen ürün varsa kategoriyi ve filtreli ürünleri döndür
        if (matchedItems.length > 0) {
            return { ...cat, items: matchedItems };
        }
        return null;
    }).filter(cat => cat !== null); // Eşleşmeyen kategorileri çıkar

    render(filteredData, true); // true: kategorileri açık getir
});

// 4. POPUP (MODAL) İŞLEMLERİ
function openModal(name, price) {
    tempProductName = name;
    tempProductPrice = price;
    tempQty = 1;
    document.getElementById('modalTitle').innerText = name;
    document.getElementById('qtyDisplay').innerText = tempQty;
    document.getElementById('noteInput').value = '';
    document.getElementById('modal').style.display = 'flex';
}

function closeModal() {
    document.getElementById('modal').style.display = 'none';
}

function changeQty(amount) {
    if (tempQty + amount > 0) {
        tempQty += amount;
        document.getElementById('qtyDisplay').innerText = tempQty;
    }
}

// 5. SEPET İŞLEMLERİ
function addToCart() {
    const note = document.getElementById('noteInput').value;
    cart.push({ name: tempProductName, price: tempProductPrice, qty: tempQty, note: note });
    renderCart();
    closeModal();
}

function removeFromCart(index) {
    cart.splice(index, 1);
    renderCart();
}

function renderCart() {
    const cartDiv = document.getElementById('cartItems');
    cartDiv.innerHTML = '';
    cart.forEach((item, index) => {
        cartDiv.innerHTML += `
            <div class="cart-item">
                <div class="cart-item-title">${item.qty}x ${item.name}</div>
                ${item.note ? `<div class="cart-item-note">Not: ${item.note}</div>` : ''}
                <button class="delete-btn" onclick="removeFromCart(${index})">X</button>
            </div>
        `;
    });
}

// 6. SİPARİŞİ YAZICIYA / MUTFAĞA GÖNDERME
function submitOrder() {
    const tableNo = document.getElementById('tableNo').value;
    if (!tableNo) { alert('Lütfen Masa Numarası Girin!'); return; }
    if (cart.length === 0) { alert('Sepetiniz Boş!'); return; }
    
    let receiptText = `MASA ${tableNo} SİPARİŞİ\n------------------\n`;
    cart.forEach(item => {
      receiptText += `${item.qty}x ${item.name}\n`;
      if(item.note) receiptText += ` * Not: ${item.note}\n`;
    });
    
    alert(`Tebrikler! Fiş Yazdırılıyor...\n\n${receiptText}`);
    
    // Sepeti Sıfırla
    cart = [];
    document.getElementById('tableNo').value = '';
    renderCart();
}

// Başlangıç tetikleyicileri
loadMenu();
// Eğer menü editlenirken aynı anda garson ekranında da güncellensin istersen süreyi ayarlayabilirsin:
setInterval(loadMenu, 60000); 
</script>
</body>
</html>
